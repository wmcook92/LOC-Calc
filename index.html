<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line of Credit Amortization Calculator</title>
  <style>
    :root{
      --bg:#f6f8fb; --panel:#fff; --ink:#152033; --muted:#667085; --line:#d8e0ea;
      --brand:#0f766e; --brand-2:#115e59; --soft:#e7f6f3; --warn:#fff7ed;
      --shadow:0 12px 30px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1220px;margin:0 auto;padding:32px 18px 56px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
    h1{font-size:32px;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.03em}
    .tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .card h2{font-size:16px;margin:0;padding:18px 20px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .body{padding:18px 20px}
    label{display:block;font-size:13px;color:#344054;font-weight:650;margin:0 0 7px}
    input,select{width:100%;height:42px;border:1px solid #cfd8e3;border-radius:11px;padding:0 12px;font-size:15px;background:#fff;color:var(--ink)}
    input:focus,select:focus{outline:3px solid rgba(15,118,110,.16);border-color:var(--brand)}
    .field{margin-bottom:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hint{font-size:12px;color:var(--muted);margin-top:6px}.small{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{border:0;border-radius:11px;padding:11px 14px;font-weight:750;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(15,118,110,.18)}
    button.secondary{background:#fff;color:#1d2939;border:1px solid #cfd8e3;box-shadow:none}.btn-full{width:100%}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .metric{background:linear-gradient(180deg,#fff,#fbfcfe);border:1px solid var(--line);border-radius:16px;padding:16px}
    .metric span{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:8px}.metric strong{font-size:22px;letter-spacing:-.02em}
    .note{background:var(--soft);border:1px solid #bae5dc;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:#134e4a}
    .table-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .table-head h2{margin:0;font-size:16px}.table-wrap{max-height:620px;overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #edf1f6;padding:10px 12px;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;color:#344054;font-size:12px;text-transform:uppercase;letter-spacing:.03em;z-index:1}th:first-child,td:first-child{text-align:left}
    tr:hover td{background:#fcfcfd}.print-title{display:none}.negative{color:#b42318}.pill{display:inline-block;background:#eef4ff;color:#3538cd;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
    @media (max-width: 920px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.tag{margin-top:12px}}
    @media print{
      @page{size:auto;margin:.45in}
      body{background:#fff;color:#000}
      body *{visibility:hidden!important}
      #printArea,#printArea *{visibility:visible!important}
      #printArea{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0;background:#fff}
      #printArea .table-head{display:block;border:0;padding:0 0 10px;background:#fff}
      #printArea .table-head .actions{display:none!important}
      #printArea .print-title{display:block;font-size:20px;font-weight:800;margin:0 0 6px;color:#000}
      #printArea .small{color:#333;margin-bottom:10px}
      #printArea .table-wrap{max-height:none;overflow:visible}
      #printArea table{font-size:10px;border-collapse:collapse;width:100%}
      #printArea th{position:static;background:#f1f1f1;color:#000}
      #printArea th,#printArea td{padding:5px 6px;border:1px solid #aaa;color:#000}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>Line of Credit Amortization Calculator</h1></div>
      <div class="tag">Customer schedule export-ready</div>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Calculator Inputs</h2>
        <div class="body">
          <div class="field"><label for="customerName">Customer Name</label><input id="customerName" value="Customer" /></div>
          <div class="row">
            <div class="field"><label for="drawDate">Planned Draw Date</label><input id="drawDate" type="date" /></div>
            <div class="field"><label for="firstDueDate">First Payment Due Date</label><input id="firstDueDate" type="date" /><div class="hint">Auto-calculated; editable.</div></div>
          </div>
          <div class="row">
            <div class="field"><label for="apr">APR</label><input id="apr" type="number" step="0.01" value="69.5" /></div>
            <div class="field"><label for="amount">Planned Draw Amount</label><input id="amount" type="number" step="100" value="75000" /></div>
          </div>
          <div class="row">
            <div class="field"><label for="term">Term Length</label><select id="term"><option value="12">12 months</option><option value="18" selected>18 months</option><option value="24">24 months</option></select></div>
            <div class="field"><label for="frequency">Payment Frequency</label><select id="frequency"><option value="Weekly">Weekly</option><option value="Monthly" selected>Monthly</option></select></div>
          </div>
          <button class="btn-full" id="recalcBtn">Recalculate Schedule</button>
          <div class="actions"><button class="secondary" id="resetDatesBtn">Reset Dates</button></div>
        </div>
      </section>
      <main>
        <section class="metrics" id="metrics"></section>
        <div class="note" id="calcNote"></div>
        <section class="table-card" id="printArea">
          <div class="table-head">
            <div>
              <div class="print-title">Amortization Schedule</div>
              <h2>Amortization Schedule</h2>
              <div class="small" id="scheduleSubhead"></div>
            </div>
            <div class="actions">
              <button class="secondary" id="csvBtn">Export CSV</button>
              <button class="secondary" id="excelBtn">Export Excel</button>
              <button id="printBtn">Print / Save PDF</button>
            </div>
          </div>
          <div class="table-wrap"><table id="scheduleTable"><thead><tr><th>Payment #</th><th>Payment Due Date</th><th>Payment</th><th>Beginning Principal</th><th>Interest Paid</th><th>Principal Paid</th><th>Ending Principal</th><th>Cumulative Int</th></tr></thead><tbody></tbody></table></div>
        </section>
      </main>
    </div>
  </div>
<script>
const $ = id => document.getElementById(id);
const currency = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const percent = new Intl.NumberFormat('en-US',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});
let currentSchedule = [];
function iso(d){ return d.toISOString().slice(0,10); }
function parseDate(v){ const [y,m,d]=v.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,days){ const x=new Date(d); x.setDate(x.getDate()+days); return x; }
function addMonths(d,months){ const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+months); if(x.getDate()<day) x.setDate(0); return x; }
function fmtDate(d){ return d.toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function money(n){ return currency.format(Math.abs(n)<0.005?0:n); }
function calcFirstDue(drawDate, frequency){
  const d = new Date(drawDate);
  if(frequency === 'Weekly'){
    // Excel logic: draw date + MOD(4 - WEEKDAY(draw date), 7), where Sunday=1; this returns the next Wednesday, or same day if Wednesday.
    const excelWeekday = d.getDay()+1;
    return addDays(d, (4 - excelWeekday + 7) % 7);
  }
  // Excel logic: if draw day <= 19, due on the 26th of same month; otherwise the 26th of the following month.
  if(d.getDate() <= 19) return new Date(d.getFullYear(), d.getMonth(), 26);
  return new Date(d.getFullYear(), d.getMonth()+1, 26);
}
function payment(rate, principal, count){
  if(count <= 0) return 0;
  if(Math.abs(rate) < 1e-12) return principal / count;
  return (rate * principal * Math.pow(1+rate,count)) / (Math.pow(1+rate,count)-1);
}
function buildSchedule(){
  const customer = $('customerName').value.trim() || 'Customer';
  const apr = Number($('apr').value || 0) / 100;
  const amount = Number($('amount').value || 0);
  const termMonths = Number($('term').value || 12);
  const frequency = $('frequency').value;
  const drawDate = parseDate($('drawDate').value);
  const firstDue = parseDate($('firstDueDate').value);
  const periodicRate = apr / (frequency === 'Weekly' ? 52 : 12);
  const payments = frequency === 'Weekly' ? Math.round(termMonths * (52/12)) : termMonths;
  const pmt = payment(periodicRate, amount, payments);
  let rows = [], principal = amount, cumulativeInterest = 0;
  for(let i=1;i<=payments;i++){
    const dueDate = i === 1 ? new Date(firstDue) : (frequency === 'Weekly' ? addDays(firstDue, 7*(i-1)) : addMonths(firstDue, i-1));
    const beginning = principal;
    const interest = beginning * periodicRate;
    const principalPaid = i === payments ? beginning : Math.min(pmt - interest, beginning);
    const actualPayment = interest + principalPaid;
    principal = beginning - principalPaid;
    if(Math.abs(principal)<0.005) principal = 0;
    cumulativeInterest += interest;
    rows.push({number:i,dueDate,payment:actualPayment,beginning,interest,principalPaid,ending:principal,cumulativeInterest});
  }
  const totalInterest = rows.reduce((s,r)=>s+r.interest,0);
  const totalPayback = amount + totalInterest;
  currentSchedule = rows;
  $('metrics').innerHTML = [
    ['Payment', money(pmt)], ['Total Payback', money(totalPayback)], ['Total Interest Cost', money(totalInterest)], ['Simple Interest', percent.format(amount ? totalInterest/amount : 0)]
  ].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('');
  $('calcNote').innerHTML = `<strong>${customer}</strong> · ${frequency} payments · ${termMonths}-month term · ${payments} total payments · Periodic rate ${percent.format(periodicRate)} · Draw date ${fmtDate(drawDate)}`;
  $('scheduleSubhead').textContent = `${customer} | ${frequency} | ${termMonths}-month term | Draw ${money(amount)} | APR ${percent.format(apr)} | First due ${fmtDate(firstDue)}`;
  renderTable(rows);
}
function renderTable(rows){
  $('scheduleTable').querySelector('tbody').innerHTML = rows.map(r=>`<tr><td>${r.number}</td><td>${fmtDate(r.dueDate)}</td><td>${money(r.payment)}</td><td>${money(r.beginning)}</td><td>${money(r.interest)}</td><td>${money(r.principalPaid)}</td><td class="${r.ending<0?'negative':''}">${money(r.ending)}</td><td>${money(r.cumulativeInterest)}</td></tr>`).join('');
}
function scheduleAsRows(){
  return [['Payment #','Payment Due Date','Payment','Beginning Principal','Interest Paid','Principal Paid','Ending Principal','Cumulative Interest'], ...currentSchedule.map(r=>[r.number,fmtDate(r.dueDate),r.payment.toFixed(2),r.beginning.toFixed(2),r.interest.toFixed(2),r.principalPaid.toFixed(2),r.ending.toFixed(2),r.cumulativeInterest.toFixed(2)])];
}
function download(filename, content, type){
  const blob = new Blob([content], {type}); const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function exportCSV(){
  const csv = scheduleAsRows().map(row => row.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  download('line-of-credit-amortization-schedule.csv', csv, 'text/csv;charset=utf-8;');
}
function exportExcel(){
  const rows = scheduleAsRows();
  const html = `<html><head><meta charset="utf-8"></head><body><table>${rows.map((row,i)=>`<tr>${row.map(v=>i===0?`<th>${v}</th>`:`<td>${v}</td>`).join('')}</tr>`).join('')}</table></body></html>`;
  download('line-of-credit-amortization-schedule.xls', html, 'application/vnd.ms-excel;charset=utf-8;');
}
function setDefaultDates(){
  const today = new Date(); $('drawDate').value = iso(today); $('firstDueDate').value = iso(calcFirstDue(today, $('frequency').value));
}
['apr','amount','term','frequency','drawDate','firstDueDate','customerName'].forEach(id => $(id).addEventListener('input', () => { if(id==='frequency' || id==='drawDate') $('firstDueDate').value = iso(calcFirstDue(parseDate($('drawDate').value), $('frequency').value)); buildSchedule(); }));
$('recalcBtn').addEventListener('click', buildSchedule); $('resetDatesBtn').addEventListener('click', () => { setDefaultDates(); buildSchedule(); }); $('csvBtn').addEventListener('click', exportCSV); $('excelBtn').addEventListener('click', exportExcel); $('printBtn').addEventListener('click', () => window.print());
setDefaultDates(); buildSchedule();
</script>
</body>
</html>
