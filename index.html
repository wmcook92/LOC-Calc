<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LT Sales Tool</title>
<style>
  :root {
    --lt-green:#00a86b;
    --lt-green-dark:#047857;
    --sidebar:#0f172a;
    --sidebar-soft:#1e293b;
    --bg:#f8fafc;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .shell { min-height:100vh; display:flex; }
  .sidebar {
    position:fixed; left:0; top:0; bottom:0; width:235px; background:linear-gradient(180deg,var(--sidebar),#111827);
    color:#fff; padding:22px 16px; display:flex; flex-direction:column; gap:18px; z-index:50; box-shadow:8px 0 24px rgba(15,23,42,.14);
  }
  .brand { border-bottom:1px solid rgba(255,255,255,.12); padding-bottom:18px; }
  .brand .eyebrow { color:#86efac; text-transform:uppercase; font-size:11px; font-weight:900; letter-spacing:.12em; margin-bottom:6px; }
  .brand h1 { font-size:22px; line-height:1.05; margin:0; letter-spacing:-.03em; }
  .brand p { margin:8px 0 0; color:#cbd5e1; font-size:12px; line-height:1.35; }
  .nav { display:flex; flex-direction:column; gap:10px; }
  .nav button {
    width:100%; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); color:#e2e8f0;
    border-radius:14px; padding:13px 14px; font-weight:800; text-align:left; cursor:pointer; transition:.15s ease; font-size:14px;
  }
  .nav button:hover { background:rgba(255,255,255,.10); }
  .nav button.active { background:#ecfdf5; border-color:#bbf7d0; color:#065f46; box-shadow:0 10px 22px rgba(0,168,107,.18); }
  .sidebar-note { margin-top:auto; color:#94a3b8; font-size:11px; line-height:1.35; border-top:1px solid rgba(255,255,255,.12); padding-top:14px; }
  .content { margin-left:235px; width:calc(100% - 235px); min-height:100vh; }
  .tool-frame { width:100%; height:100vh; border:0; display:none; background:#f8fafc; }
  .tool-frame.active { display:block; }
  @media(max-width:760px) {
    .shell { display:block; }
    .sidebar { position:sticky; width:100%; height:auto; bottom:auto; padding:14px; }
    .brand h1 { font-size:20px; }
    .brand p, .sidebar-note { display:none; }
    .nav { display:grid; grid-template-columns:1fr 1fr; }
    .content { margin-left:0; width:100%; }
    .tool-frame { height:calc(100vh - 142px); }
  }
  @media print {
    .sidebar { display:none!important; }
    .content { margin-left:0; width:100%; }
    .tool-frame { height:100vh; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="eyebrow">LendingTree</div>
      <h1>LT Sales Tool</h1>
      <p>Select a calculator below. Each tool keeps its own inputs, outputs, and export options.</p>
    </div>
    <nav class="nav" aria-label="Calculator navigation">
      <button id="termBtn" class="active" type="button" onclick="showTool('term')">Term Loan Calc</button>
      <button id="locBtn" type="button" onclick="showTool('loc')">LOC Calc</button>
    </nav>
    <div class="sidebar-note">GitHub Pages ready: upload this single <strong>index.html</strong> file to the root of your repo.</div>
  </aside>
  <main class="content">
    <iframe id="termFrame" class="tool-frame active" title="Term Loan Calculator"></iframe>
    <iframe id="locFrame" class="tool-frame" title="Line of Credit Calculator"></iframe>
  </main>
</div>

const loaded = { term:false, loc:false };
function loadTool(name) {
  if (loaded[name]) return;
  document.getElementById(name + 'Frame').src = TOOL_HTML[name];
  loaded[name] = true;
}
function showTool(name) {
  loadTool(name);
  const other = name === 'term' ? 'loc' : 'term';
  document.getElementById(name + 'Frame').classList.add('active');
  document.getElementById(other + 'Frame').classList.remove('active');
  document.getElementById(name + 'Btn').classList.add('active');
  document.getElementById(other + 'Btn').classList.remove('active');
}
